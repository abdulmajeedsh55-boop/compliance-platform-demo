<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تعريف المنسوبين — منصة الرقابة والامتثال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
  .filters-bar{ display:flex; align-items:center; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
  .filters-bar input[type="text"]{ flex:1; min-width:200px; font-family:'IBM Plex Sans Arabic'; font-size:13.5px; padding:9px 14px; border:1px solid var(--gray-400); border-radius:var(--radius-sm); background:#fff; }
  .filters-bar input:focus{ outline:2px solid var(--brand-300); border-color:var(--brand-600); }
  .filters-bar select{ font-family:'IBM Plex Sans Arabic'; font-size:13px; padding:10px 12px; border:1px solid var(--gray-400); border-radius:var(--radius-sm); background:#fff; }
  .filters-bar label.checkbox{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-muted); white-space:nowrap; }
</style>
</head>
<body data-page="personnel">

  <div data-include="partials/topnav.html"></div>

  <div class="app-shell">
    <div data-include="partials/sidebar.html"></div>

    <main class="app-content">
      <div class="breadcrumb"><a href="dashboard.html">لوحة القيادة</a> / تعريف المنسوبين</div>
      <div class="page-head">
        <div>
          <h1>تعريف المنسوبين</h1>
          <p class="sub">السجل المرجعي لهوية كل منسوب في الجهة، ومصدر البيانات الذي تشير إليه القضايا الإدارية.</p>
        </div>
        <button class="btn primary" type="button" id="openAddPersonnelBtn">+ إضافة منسوب</button>
      </div>

      <div class="filters-bar">
        <input type="text" id="searchInput" placeholder="ابحث برقم المنسوب أو الاسم…">
        <select id="orgUnitFilter"></select>
        <select id="rankFilter"></select>
        <label class="checkbox"><input type="checkbox" id="includeArchivedCheckbox"> إظهار المؤرشفين</label>
      </div>

      <div class="panel">
        <table class="data-table">
          <thead><tr><th>رقم المنسوب</th><th>الاسم</th><th>الرتبة</th><th>جهة العمل</th><th>تاريخ الالتحاق</th><th>الحالة</th></tr></thead>
          <tbody id="personnelBody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div data-include="partials/footer.html"></div>

  <div id="addPersonnelDialog" style="display:none; position:fixed; inset:0; background:rgba(17,25,39,.5); align-items:center; justify-content:center; z-index:50;">
    <div style="background:#fff; border-radius:var(--radius-lg); padding:24px; width:100%; max-width:420px;">
      <h2 style="margin:0 0 12px;">إضافة منسوب جديد</h2>
      <div class="field">
        <label>رقم المنسوب</label>
        <input type="text" id="addPersonnelNumberInput" placeholder="مثال: ID-90001">
      </div>
      <div class="field">
        <label>الاسم الكامل</label>
        <input type="text" id="addPersonnelNameInput">
      </div>
      <div class="field">
        <label>الرتبة</label>
        <input type="text" id="addPersonnelRankInput">
      </div>
      <div class="field">
        <label>جهة العمل</label>
        <select id="addPersonnelUnitSelect"></select>
      </div>
      <div class="field">
        <label>تاريخ الالتحاق</label>
        <input type="date" id="addPersonnelJoinDateInput">
      </div>
      <p id="addPersonnelError" style="display:none; color:var(--error-700); font-size:12.5px;"></p>
      <div style="display:flex; gap:10px; margin-top:12px;">
        <button class="btn primary" id="addPersonnelConfirmBtn" type="button">إضافة</button>
        <button class="btn outline" id="addPersonnelCancelBtn" type="button">إلغاء</button>
      </div>
    </div>
  </div>

  <div id="personnelDetailDialog" style="display:none; position:fixed; inset:0; background:rgba(17,25,39,.5); align-items:center; justify-content:center; z-index:50;">
    <div style="background:#fff; border-radius:var(--radius-lg); padding:24px; width:100%; max-width:460px;">
      <h2 id="detailName" style="margin:0 0 12px;"></h2>
      <div class="field-row"><span class="k">رقم المنسوب</span><span class="v mono" id="detailNumber"></span></div>
      <div class="field-row"><span class="k">الرتبة</span><span class="v" id="detailRank"></span></div>
      <div class="field-row"><span class="k">جهة العمل</span><span class="v" id="detailUnit"></span></div>
      <div class="field-row"><span class="k">تاريخ الالتحاق</span><span class="v" id="detailJoinDate"></span></div>
      <div class="field-row"><span class="k">الحالة</span><span class="v" id="detailStatus"></span></div>
      <h2 style="margin:16px 0 8px; font-size:13.5px;">القضايا المرتبطة</h2>
      <div id="detailCasesList" style="font-size:12.5px; color:var(--text-muted);"></div>
      <p id="detailArchiveError" style="display:none; color:var(--error-700); font-size:12.5px; margin-top:10px;"></p>
      <div style="display:flex; gap:10px; margin-top:16px;">
        <button class="btn danger" id="archivePersonnelBtn" type="button">أرشفة</button>
        <button class="btn outline" id="detailCloseBtn" type="button">إغلاق</button>
      </div>
    </div>
  </div>

  <script src="js/persist.js"></script>
<script src="js/mock-data.js"></script>
  <script src="js/org-data.js"></script>
  <script src="js/org-tree.js"></script>
  <script src="js/permissions.js"></script>
  <script src="js/personnel-data.js"></script>
  <script src="js/personnel.js"></script>
  <script src="js/masking.js"></script>
  <script src="js/lab-data.js"></script>
  <script src="js/awareness-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth-rules.js"></script>
  <script src="js/partials.js"></script>
  <script src="js/personnel-page.js"></script>
</body>
</html>
