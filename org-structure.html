<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الهيكل التنظيمي — منصة الرقابة والامتثال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
  .org-tree{ padding:16px; }
  .org-node{ margin-bottom:2px; }
  .org-node .org-children{ padding-right:24px; border-right:1px dashed var(--border-strong); margin-right:10px; }
  .org-node-head{ display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:var(--radius-sm); }
  .org-node-head:hover{ background:var(--gray-100); }
  .org-toggle{ background:none; border:none; cursor:pointer; font-size:12px; color:var(--text-faint); width:16px; padding:0; }
  .org-toggle-spacer{ width:16px; display:inline-block; }
  .org-name{ font-weight:600; font-size:13.5px; }
  .org-level-tag{ font-size:11px; color:var(--text-faint); background:var(--gray-100); padding:2px 8px; border-radius:999px; }
  .org-stats{ font-size:11.5px; color:var(--text-muted); margin-right:auto; font-family:'JetBrains Mono',monospace; }
</style>
</head>
<body data-page="org-structure">

  <div data-include="partials/topnav.html"></div>

  <div class="app-shell">
    <div data-include="partials/sidebar.html"></div>

    <main class="app-content">
      <div class="breadcrumb"><a href="dashboard.html">لوحة القيادة</a> / الهيكل التنظيمي</div>
      <div class="page-head">
        <div>
          <h1>الهيكل التنظيمي الموحّد</h1>
          <p class="sub">الجهاز الرئيسي، المناطق الرئيسية، والإدارات والشعب والأقسام التابعة لها.</p>
        </div>
        <div style="display:flex; gap:10px;">
          <button class="btn outline" type="button" id="openAddUnitBtn">+ إضافة وحدة</button>
          <button class="btn primary" type="button" id="openTransferBtn">نقل منسوب</button>
        </div>
      </div>

      <div class="panel">
        <div class="org-tree" id="orgTree"></div>
      </div>
    </main>
  </div>

  <div data-include="partials/footer.html"></div>

  <div id="transferDialog" style="display:none; position:fixed; inset:0; background:rgba(17,25,39,.5); align-items:center; justify-content:center; z-index:50;">
    <div style="background:#fff; border-radius:var(--radius-lg); padding:24px; width:100%; max-width:420px;">
      <h2 style="margin:0 0 12px;">نقل تبعية منسوب</h2>
      <div class="field">
        <label>المنسوب</label>
        <select id="transferPersonSelect"></select>
      </div>
      <div class="field">
        <label>الوحدة التنظيمية الجديدة</label>
        <select id="transferUnitSelect"></select>
      </div>
      <p id="transferError" style="display:none; color:var(--error-700); font-size:12.5px;"></p>
      <div style="display:flex; gap:10px; margin-top:12px;">
        <button class="btn primary" id="transferConfirmBtn" type="button">تأكيد النقل</button>
        <button class="btn outline" id="transferCancelBtn" type="button">إلغاء</button>
      </div>
    </div>
  </div>

  <div id="addUnitDialog" style="display:none; position:fixed; inset:0; background:rgba(17,25,39,.5); align-items:center; justify-content:center; z-index:50;">
    <div style="background:#fff; border-radius:var(--radius-lg); padding:24px; width:100%; max-width:420px;">
      <h2 style="margin:0 0 12px;">إضافة وحدة تنظيمية</h2>
      <div class="field">
        <label>الوحدة الأم</label>
        <select id="addUnitParentSelect"></select>
      </div>
      <div class="field">
        <label>اسم الوحدة الجديدة</label>
        <input type="text" id="addUnitNameInput" placeholder="مثال: إدارة الشؤون الإدارية">
      </div>
      <p id="addUnitError" style="display:none; color:var(--error-700); font-size:12.5px;"></p>
      <div style="display:flex; gap:10px; margin-top:12px;">
        <button class="btn primary" id="addUnitConfirmBtn" type="button">إضافة</button>
        <button class="btn outline" id="addUnitCancelBtn" type="button">إلغاء</button>
      </div>
    </div>
  </div>

  <script src="js/persist.js"></script>
<script src="js/mock-data.js"></script>
  <script src="js/org-data.js"></script>
  <script src="js/org-tree.js"></script>
  <script src="js/permissions.js"></script>
  <script src="js/personnel-data.js"></script>
  <script src="js/personnel.js"></script>
  <script src="js/masking.js"></script>
  <script src="js/lab-data.js"></script>
  <script src="js/awareness-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth-rules.js"></script>
  <script src="js/partials.js"></script>
  <script src="js/org-structure.js"></script>
</body>
</html>
