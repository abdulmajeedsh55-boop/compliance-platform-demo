<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة الصلاحيات — منصة الرقابة والامتثال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
  .perm-picker{ display:flex; align-items:center; gap:10px; margin-bottom:20px; }
  .perm-picker select{ font-family:'IBM Plex Sans Arabic'; font-size:13.5px; padding:9px 14px; border:1px solid var(--gray-400); border-radius:var(--radius-sm); background:#fff; min-width:260px; }
  .perm-group{ border-bottom:1px solid var(--border); }
  .perm-group:last-child{ border-bottom:none; }
  .perm-group-head{ padding:12px 20px; background:var(--gray-100); font-weight:600; font-size:12.5px; color:var(--gray-700); }
  .perm-row{ display:flex; align-items:center; justify-content:space-between; padding:12px 20px; border-bottom:1px solid var(--border); }
  .perm-row:last-child{ border-bottom:none; }
  .perm-row.reserved{ background:var(--warn-50); }
  .perm-label{ font-size:13px; }
  .perm-reserved-note{ font-size:11px; color:var(--warn-700); }
  .perm-unenforced-note{ font-size:11px; color:var(--text-faint); }
  .perm-toggle{ position:relative; width:38px; height:20px; display:inline-block; }
  .perm-toggle input{ opacity:0; width:0; height:0; }
  .perm-toggle .slider{ position:absolute; inset:0; background:var(--gray-300); border-radius:999px; cursor:pointer; transition:background .15s; }
  .perm-toggle .slider::before{ content:""; position:absolute; width:16px; height:16px; right:2px; top:2px; background:#fff; border-radius:50%; transition:transform .15s; }
  .perm-toggle input:checked + .slider{ background:var(--brand-600); }
  .perm-toggle input:checked + .slider::before{ transform:translateX(-18px); }
  .perm-toggle input:disabled + .slider{ opacity:.5; cursor:not-allowed; }
</style>
</head>
<body data-page="permissions">

  <div data-include="partials/topnav.html"></div>

  <div class="app-shell">
    <div data-include="partials/sidebar.html"></div>

    <main class="app-content">
      <div class="breadcrumb"><a href="dashboard.html">لوحة القيادة</a> / إدارة الصلاحيات</div>
      <div class="page-head">
        <div>
          <h1>إدارة الصلاحيات</h1>
          <p class="sub" id="scopeNote"></p>
        </div>
      </div>

      <div class="perm-picker">
        <label for="personSelect">اختر شخصاً:</label>
        <select id="personSelect"><option value="">— اختر —</option></select>
      </div>

      <p id="permError" style="display:none; color:var(--error-700); font-size:12.5px; margin-bottom:12px;"></p>

      <div class="panel" id="permMatrix" style="display:none"></div>
    </main>
  </div>

  <div data-include="partials/footer.html"></div>

  <script src="js/persist.js"></script>
<script src="js/mock-data.js"></script>
  <script src="js/org-data.js"></script>
  <script src="js/org-tree.js"></script>
  <script src="js/permissions.js"></script>
  <script src="js/personnel-data.js"></script>
  <script src="js/personnel.js"></script>
  <script src="js/masking.js"></script>
  <script src="js/lab-data.js"></script>
  <script src="js/awareness-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth-rules.js"></script>
  <script src="js/partials.js"></script>
  <script src="js/permissions-page.js"></script>
</body>
</html>
